packages:
  - "packages/*"
  - "integrations/*"
  - "sandbox/arkos/*"
  - "documentation"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  vue-demi: true
supportedArchitectures:
  os:
    - current
  cpu:
    - current
  arch:
    - current
sharedWorkspaceLockfile: false
shamefullyHoist: true
preferLocal: true
minimumReleaseAgeExclude:
  - '@arkosjs/websockets-client@0.2.0'
  - arkos@1.8.0-canary.6
overrides:
  style-to-js: 1.1.16
